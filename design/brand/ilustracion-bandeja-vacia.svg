  <circle cx="206" cy="150" r="15" fill="url(#halo)"/><circle cx="206" cy="150" r="2.8" fill="#ffcf5c" fill-opacity=".6"/>
  <!-- Yours: the symbol (48 × 48) at scale 1.5, with origin at (124,40). -->
  <circle cx="144.25" cy="91.75" r="52" fill="url(#halo)"/>
  <path fill="#f5f0e4" d="M158.97 73.03 153.12 55.56A8.4 8.4 0 1 1 168.33 57.15zM162.97 77.04 178.86 67.68A8.4 8.4 0 1 1 180.45 82.89z"/>
