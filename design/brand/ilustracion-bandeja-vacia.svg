  </defs>
  <!-- Grass: stems of uneven heights, in a tone barely lighter than the night. -->
  <path fill="none" stroke="#1e3650" stroke-width="3" stroke-linecap="round" d="M14 180v-22M31 180v-36M47 180v-15M70 180v-28M96 180v-12M118 180v-31M139 180v-18M171 180v-25M190 180v-13M214 180v-34M236 180v-20M262 180v-27M283 180v-14M305 180v-30"/>
